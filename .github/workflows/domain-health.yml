name: ERN Domain Health

# Manual while ERN is in active build/consolidation mode.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Diagnose custom domain
        run: |
          npm run domain:health -- earthrightnow.app
          npm run domain:health -- www.earthrightnow.app
