name: Phase 4 Earth Signals Pilot Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Controlled Earth Signals pilot runtime action"
        required: true
        type: choice
        options:
          - activate
          - rollback

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Phase 4 pilot safety
        run: |
          set -euo pipefail
          node tests/earth-signal-worker.smoke.js
          node tests/earth-signal-service.smoke.js
          node scripts/earth-signal-status.mjs
          if [ "${{ inputs.action }}" = "activate" ]; then
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "true"' signals-worker/wrangler.jsonc
            node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("data/earth-signal-deployment.json","utf8"));const p=JSON.parse(fs.readFileSync("data/phase4-earth-signals-pilot.json","utf8"));if(d.status!=="DEPLOYED"||d.observability!==true||d.costGuard!==true||p.ownerApproval!==true||p.runtimeActivationAllowed!==true)process.exit(1)'
          else
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "true"' signals-worker/wrangler.jsonc
          fi
      - name: Require Cloudflare credentials and Earth Signals secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_RATE_HMAC_KEY: ${{ secrets.ERN_RATE_HMAC_KEY }}
          ERN_SIGNAL_REVIEW_TOKEN: ${{ secrets.ERN_SIGNAL_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ERN_RATE_HMAC_KEY"
          test -n "$ERN_SIGNAL_REVIEW_TOKEN"
      - name: Prepare requested runtime config
        run: |
          set -euo pipefail
          if [ "${{ inputs.action }}" = "activate" ]; then
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "true"' signals-worker/wrangler.jsonc
          else
            node -e 'const fs=require("fs");const p="signals-worker/wrangler.jsonc";let s=fs.readFileSync(p,"utf8");s=s.replace(/"ERN_EARTH_SIGNALS_ENABLED":\s*"true"/,"\"ERN_EARTH_SIGNALS_ENABLED\": \"false\"");if(!s.includes("\"ERN_EARTH_SIGNALS_ENABLED\": \"false\""))process.exit(1);fs.writeFileSync(p,s)'
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "false"' signals-worker/wrangler.jsonc
          fi
      - name: Install Earth Signals runtime secrets
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_RATE_HMAC_KEY: ${{ secrets.ERN_RATE_HMAC_KEY }}
          ERN_SIGNAL_REVIEW_TOKEN: ${{ secrets.ERN_SIGNAL_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ERN_RATE_HMAC_KEY" | npx --yes wrangler@latest secret put ERN_RATE_HMAC_KEY
          printf '%s' "$ERN_SIGNAL_REVIEW_TOKEN" | npx --yes wrangler@latest secret put ERN_SIGNAL_REVIEW_TOKEN
      - name: Deploy Earth Signals runtime state
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Confirm requested runtime state in checked-out config
        run: |
          set -euo pipefail
          if [ "${{ inputs.action }}" = "activate" ]; then
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "true"' signals-worker/wrangler.jsonc
            echo "Earth Signals Worker deployed in pilot-enabled runtime state."
          else
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "false"' signals-worker/wrangler.jsonc
            echo "Earth Signals Worker rolled back to runtime OFF."
          fi
