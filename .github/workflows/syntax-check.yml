name: ERN JavaScript Syntax Check

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/earth-signal-*.smoke.js"
      - "signals-worker/**"
      - "submission-worker/**"
      - "tests/submission-worker.smoke.js"
      - "tests/submission-client.smoke.js"
      - "tests/participation-worker-deploy.smoke.js"
      - "tests/participation-infrastructure-status.smoke.js"
      - "tests/participation-deployment-verify.smoke.js"
      - "tests/participation-operator.smoke.js"
      - "tests/participation-storage-bounds.smoke.js"
      - "tests/participation-public-surfaces.smoke.js"
      - "tests/phase-k-release-read.smoke.js"
      - "tests/now-moment-photo-foundation.smoke.js"
      - "tests/now-moment-photo-service.smoke.js"
      - "data/now-moment-media-deployment.json"
      - "now-moments.html"
      - "for-places.html"
      - "data/earth-signal-deployment.json"
      - "data/submission-transport.json"
      - ".github/workflows/deploy-participation-workers.yml"
      - "tests/guide-ai-*.smoke.js"
      - "data/earth-signal-deployment.json"
      - "data/guide-ai-deployment.json"
      - ".github/workflows/syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find src scripts worker travel-worker signals-worker submission-worker -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run Earth Signal focused smoke tests
        run: |
          set -euo pipefail
          for test in tests/earth-signal-*.smoke.js; do
            node "$test"
          done
      - name: Run Submission and participation deployment smoke tests
        run: |
          set -euo pipefail
          node tests/submission-worker.smoke.js
          node tests/submission-client.smoke.js
          node tests/participation-worker-deploy.smoke.js
          node tests/participation-infrastructure-status.smoke.js
          node tests/participation-deployment-verify.smoke.js
          node tests/participation-operator.smoke.js
          node tests/participation-storage-bounds.smoke.js
          node tests/participation-public-surfaces.smoke.js
          node tests/phase-k-release-read.smoke.js
          node tests/now-moment-photo-foundation.smoke.js
          node tests/now-moment-photo-service.smoke.js
      - name: Run Generative Guide focused smoke tests
        run: |
          set -euo pipefail
          for test in tests/guide-ai-*.smoke.js; do
            node "$test"
          done
