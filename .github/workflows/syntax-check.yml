name: ERN JavaScript Syntax Check

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/earth-signal-*.smoke.js"
      - "tests/guide-ai-*.smoke.js"
      - "data/earth-signal-deployment.json"
      - "data/guide-ai-deployment.json"
      - ".github/workflows/syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run Earth Signal focused smoke tests
        run: |
          set -euo pipefail
          for test in tests/earth-signal-*.smoke.js; do
            node "$test"
          done
      - name: Run Generative Guide focused smoke tests
        run: |
          set -euo pipefail
          for test in tests/guide-ai-*.smoke.js; do
            node "$test"
          done
