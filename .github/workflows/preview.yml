name: ERN Preview Artifact

# Manual only. Preview builds are useful at checkpoints, not on every PR update.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify and build candidate
        run: |
          npm test
          npm run release:build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ern-preview
          path: dist
          retention-days: 3
