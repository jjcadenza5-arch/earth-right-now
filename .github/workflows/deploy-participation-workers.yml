name: Deploy ERN Participation Workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fail-closed participation Worker to deploy"
        required: true
        type: choice
        options:
          - earth-signals
          - submissions

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify repository safety gates
        run: |
          set -euo pipefail
          node tests/earth-signal-worker.smoke.js
          node tests/submission-worker.smoke.js
          grep -q '"ERN_EARTH_SIGNALS_ENABLED": "false"' signals-worker/wrangler.jsonc
          grep -q '"ERN_SUBMISSION_ENABLED": "false"' submission-worker/wrangler.jsonc
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Earth Signals Worker
        if: ${{ inputs.target == 'earth-signals' }}
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Deploy Submission Worker
        if: ${{ inputs.target == 'submissions' }}
        working-directory: submission-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Preserve fail-closed activation boundary
        run: |
          set -euo pipefail
          grep -q '"ERN_EARTH_SIGNALS_ENABLED": "false"' signals-worker/wrangler.jsonc
          grep -q '"ERN_SUBMISSION_ENABLED": "false"' submission-worker/wrangler.jsonc
          echo "Deployment may create infrastructure only; public activation remains off."
