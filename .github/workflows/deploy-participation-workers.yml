name: Deploy ERN Participation Workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fail-closed participation Worker to deploy"
        required: true
        type: choice
        options:
          - earth-signals
          - submissions
          - now-moment-media

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify repository safety gates
        run: |
          set -euo pipefail
          node tests/earth-signal-worker.smoke.js
          node tests/submission-worker.smoke.js
          node tests/now-moment-photo-foundation.smoke.js
          node tests/now-moment-photo-service.smoke.js
          node tests/now-moment-media-worker.smoke.js
          node scripts/participation-infrastructure-status.mjs
          node scripts/now-moment-media-status.mjs
          if grep -q '"ERN_EARTH_SIGNALS_ENABLED": "true"' signals-worker/wrangler.jsonc; then
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("data/phase4-earth-signals-pilot.json","utf8"));const ok=x.phase===4&&x.feature==="earth-signals"&&x.ownerApproval===true&&x.runtimeActivationAllowed===true&&(x.publicManifestActivationAllowed===false||(x.publicManifestActivationAllowed===true&&x.healthVerified===true));if(!ok)process.exit(1)'
          else
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "false"' signals-worker/wrangler.jsonc
          fi
          grep -q '"ERN_SUBMISSION_ENABLED": "false"' submission-worker/wrangler.jsonc
          grep -q '"ERN_NOW_MOMENT_PHOTO_ENABLED": "false"' media-worker/wrangler.jsonc
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Require Earth Signals runtime secrets
        if: ${{ inputs.target == 'earth-signals' }}
        env:
          ERN_RATE_HMAC_KEY: ${{ secrets.ERN_RATE_HMAC_KEY }}
          ERN_SIGNAL_REVIEW_TOKEN: ${{ secrets.ERN_SIGNAL_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ERN_RATE_HMAC_KEY"
          test -n "$ERN_SIGNAL_REVIEW_TOKEN"
      - name: Install Earth Signals runtime secrets
        if: ${{ inputs.target == 'earth-signals' }}
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_RATE_HMAC_KEY: ${{ secrets.ERN_RATE_HMAC_KEY }}
          ERN_SIGNAL_REVIEW_TOKEN: ${{ secrets.ERN_SIGNAL_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ERN_RATE_HMAC_KEY" | npx --yes wrangler@latest secret put ERN_RATE_HMAC_KEY
          printf '%s' "$ERN_SIGNAL_REVIEW_TOKEN" | npx --yes wrangler@latest secret put ERN_SIGNAL_REVIEW_TOKEN
      - name: Deploy Earth Signals Worker
        if: ${{ inputs.target == 'earth-signals' }}
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Require Submission runtime secrets
        if: ${{ inputs.target == 'submissions' }}
        env:
          ERN_SUBMISSION_RATE_HMAC_KEY: ${{ secrets.ERN_SUBMISSION_RATE_HMAC_KEY }}
          ERN_SUBMISSION_REVIEW_TOKEN: ${{ secrets.ERN_SUBMISSION_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ERN_SUBMISSION_RATE_HMAC_KEY"
          test -n "$ERN_SUBMISSION_REVIEW_TOKEN"
      - name: Install Submission runtime secrets
        if: ${{ inputs.target == 'submissions' }}
        working-directory: submission-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_SUBMISSION_RATE_HMAC_KEY: ${{ secrets.ERN_SUBMISSION_RATE_HMAC_KEY }}
          ERN_SUBMISSION_REVIEW_TOKEN: ${{ secrets.ERN_SUBMISSION_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ERN_SUBMISSION_RATE_HMAC_KEY" | npx --yes wrangler@latest secret put ERN_SUBMISSION_RATE_HMAC_KEY
          printf '%s' "$ERN_SUBMISSION_REVIEW_TOKEN" | npx --yes wrangler@latest secret put ERN_SUBMISSION_REVIEW_TOKEN
      - name: Deploy Submission Worker
        if: ${{ inputs.target == 'submissions' }}
        working-directory: submission-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Require Now Moment Media runtime prerequisites
        if: ${{ inputs.target == 'now-moment-media' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_MEDIA_RATE_HMAC_KEY: ${{ secrets.ERN_MEDIA_RATE_HMAC_KEY }}
          ERN_MEDIA_REVIEW_TOKEN: ${{ secrets.ERN_MEDIA_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ERN_MEDIA_RATE_HMAC_KEY"
          test -n "$ERN_MEDIA_REVIEW_TOKEN"
          npx --yes wrangler@latest r2 bucket list --json > /tmp/ern-r2-buckets.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/ern-r2-buckets.json","utf8"));const rows=Array.isArray(x)?x:(x.buckets||[]);if(!rows.some(b=>(b.name||b.bucket_name)==="ern-now-moment-media"))process.exit(1)'
      - name: Install Now Moment Media runtime secrets
        if: ${{ inputs.target == 'now-moment-media' }}
        working-directory: media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_MEDIA_RATE_HMAC_KEY: ${{ secrets.ERN_MEDIA_RATE_HMAC_KEY }}
          ERN_MEDIA_REVIEW_TOKEN: ${{ secrets.ERN_MEDIA_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ERN_MEDIA_RATE_HMAC_KEY" | npx --yes wrangler@latest secret put ERN_MEDIA_RATE_HMAC_KEY
          printf '%s' "$ERN_MEDIA_REVIEW_TOKEN" | npx --yes wrangler@latest secret put ERN_MEDIA_REVIEW_TOKEN
      - name: Deploy Now Moment Media Worker
        if: ${{ inputs.target == 'now-moment-media' }}
        working-directory: media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Preserve fail-closed activation boundary
        run: |
          set -euo pipefail
          if grep -q '"ERN_EARTH_SIGNALS_ENABLED": "true"' signals-worker/wrangler.jsonc; then
            test "${{ inputs.target }}" = "earth-signals"
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("data/phase4-earth-signals-pilot.json","utf8"));const ok=x.ownerApproval===true&&x.runtimeActivationAllowed===true&&(x.publicManifestActivationAllowed===false||(x.publicManifestActivationAllowed===true&&x.healthVerified===true));if(!ok)process.exit(1)'
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("data/phase4-earth-signals-pilot.json","utf8"));console.log(x.publicManifestActivationAllowed===true?"Phase 4 Earth Signals limited public pilot remains active under verified approval.":"Phase 4 Earth Signals runtime pilot deployed under explicit approval; public manifest remains off until live health verification.")'
          else
            grep -q '"ERN_EARTH_SIGNALS_ENABLED": "false"' signals-worker/wrangler.jsonc
            echo "Participation Worker deployed fail-closed."
          fi
          grep -q '"ERN_SUBMISSION_ENABLED": "false"' submission-worker/wrangler.jsonc
          grep -q '"ERN_NOW_MOMENT_PHOTO_ENABLED": "false"' media-worker/wrangler.jsonc
