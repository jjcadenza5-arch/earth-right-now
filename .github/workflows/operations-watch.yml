name: ERN Operations Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/operations-watch.yml"
      - "data/sources.json"
      - "data/search-supplemental.json"
      - "data/provider-observations.json"
      - "data/embed-research-candidates.json"
      - "data/embed-provider-families.json"
      - "data/provider-generated-targets.json"
      - "data/current-image-pilot-observations.json"
      - "data/affiliate-partners.json"
      - "data/travel-offers.json"
      - "data/commercial-research-candidates.json"
      - "data/affiliate-platform-research.json"
      - "data/submission-transport.json"
      - "data/earth-signal-deployment.json"
      - "data/guide-ai-deployment.json"
      - "data/local-directory.json"
      - "data/local-directory-supplemental.json"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "data/phase10-*.json"
      - "data/soft-launch-stage1-*.json"
      - "data/analytics-deployment.json"
      - "data/business-growth-signals.json"
      - "data/soft-launch-analytics-approval.json"
      - "analytics-worker/**"
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore previous trend snapshot
        uses: actions/cache/restore@v4
        with:
          path: ern-history/previous.json
          key: ern-ops-trend-${{ github.run_id }}
          restore-keys: |
            ern-ops-trend-
      - name: Restore previous availability sample
        uses: actions/cache/restore@v4
        with:
          path: ern-history/availability-previous.json
          key: ern-availability-${{ github.run_id }}
          restore-keys: |
            ern-availability-
      - name: Restore searchable source health state
        uses: actions/cache/restore@v4
        with:
          path: ern-history/searchable-source-health-state.json
          key: ern-searchable-health-${{ github.run_id }}
          restore-keys: |
            ern-searchable-health-
      - name: Build daily operations packet
        run: |
          set -euo pipefail
          mkdir -p ern-ops ern-history
          npm --silent run domain:health | tee ern-ops/domain-health.json
          npm --silent run soft-launch:status -- ern-ops/domain-health.json | tee ern-ops/soft-launch-stage1-status.json
          npm --silent run analytics:health | tee ern-ops/analytics-health.json
          npm --silent run sources:horizon | tee ern-ops/verification-horizon.json
          npm --silent run sources:availability | tee ern-ops/source-availability.json
          npm --silent run sources:searchable-health -- ern-history/searchable-source-health-state.json | tee ern-ops/searchable-source-health.json
          if [ -f ern-history/availability-previous.json ]; then
            npm --silent run sources:availability-continuity -- ern-history/availability-previous.json ern-ops/source-availability.json | tee ern-ops/source-availability-continuity.json
          else
            npm --silent run sources:availability-continuity -- - ern-ops/source-availability.json | tee ern-ops/source-availability-continuity.json
          fi
          npm --silent run sources:revalidation-triage -- ern-ops/source-availability.json ern-ops/source-availability-continuity.json | tee ern-ops/source-revalidation-triage.json
          npm --silent run search:metadata-audit | tee ern-ops/search-metadata-audit.json
          npm --silent run atlas:reference-audit -- --network | tee ern-ops/reference-handoff-audit.json || true
          cp ern-ops/source-availability.json ern-history/availability-previous.json
          npm --silent run watch-earth:now | tee ern-ops/watch-earth-now.json
          npm --silent run watch-earth:balance | tee ern-ops/watch-earth-balance.json
          npm --silent run provider:worklist | tee ern-ops/provider-worklist.json
          npm --silent run inside:recovery | tee ern-ops/inside-recovery.json
          npm --silent run inside:playback-horizon | tee ern-ops/inside-playback-horizon.json
          npm --silent run inside:operator-review-queue | tee ern-ops/operator-review-queue.json
          npm --silent run inside:evidence-consistency | tee ern-ops/playback-evidence-consistency.json
          npm --silent run inside:providers | tee ern-ops/inside-provider-resilience.json
          npm --silent run inside:research | tee ern-ops/embed-research.json
          npm --silent run inside:research-preflight | tee ern-ops/embed-research-preflight.json
          npm --silent run inside:provider-family-research | tee ern-ops/provider-family-research.json
          npm --silent run inside:provider-generated-targets | tee ern-ops/provider-generated-targets.json
          npm --silent run inside:current-image-verification | tee ern-ops/provider-current-image-verification.json
          npm --silent run inside:current-image-promotion-plan -- ern-ops/provider-current-image-verification.json | tee ern-ops/current-image-promotion-plan.json
          npm --silent run inside:current-image-pilot-observation | tee ern-ops/current-image-pilot-observation.json
          npm --silent run inside:provider-discovery | tee ern-ops/provider-discovery-queue.json
          npm --silent run inside:research-review-queue -- ern-ops/embed-research-preflight.json ern-ops/provider-family-research.json | tee ern-ops/research-review-queue.json
          npm --silent run business:inventory | tee ern-ops/commercial-inventory.json
          npm --silent run business:verification-horizon | tee ern-ops/commercial-verification-horizon.json
          npm --silent run business:onboarding-plan | tee ern-ops/commercial-onboarding-plan.json
          npm --silent run business:research-status | tee ern-ops/commercial-research.json
          npm --silent run business:research-depth | tee ern-ops/commercial-research-depth.json
          npm --silent run business:affiliate-research | tee ern-ops/affiliate-platform-research.json
          npm --silent run business:affiliate-readiness | tee ern-ops/affiliate-application-readiness.json
          npm --silent run business:submission-transport | tee ern-ops/submission-transport-readiness.json
          npm --silent run business:control | tee ern-ops/business-control.json
          npm --silent run operations:external-gates | tee ern-ops/external-gates.json
          npm --silent run earth-signals:status | tee ern-ops/earth-signals-status.json
          npm --silent run earth-signals:live-health | tee ern-ops/earth-signals-live-health.json
          npm --silent run phase4:earth-signals-observation -- ern-ops/earth-signals-live-health.json | tee ern-ops/phase4-earth-signals-observation.json
          npm --silent run phase5:readiness -- ern-ops/earth-signals-live-health.json | tee ern-ops/phase5-readiness.json
          npm --silent run phase5:status | tee ern-ops/phase5-operating-status.json
          npm --silent run phase6:status | tee ern-ops/phase6-operating-status.json
          npm --silent run phase7:status | tee ern-ops/phase7-operating-status.json
          npm --silent run phase8:status | tee ern-ops/phase8-operating-status.json
          npm --silent run phase9:status | tee ern-ops/phase9-operating-status.json
          npm --silent run phase10:status | tee ern-ops/phase10-operating-status.json
          npm --silent run guide-ai:status | tee ern-ops/guide-ai-status.json
          npm --silent run local:directory-status | tee ern-ops/local-directory-status.json
          npm --silent run participation:status | tee ern-ops/participation-infrastructure.json
          npm --silent run participation:media-status | tee ern-ops/now-moment-media-status.json
          npm --silent run operations:trend-snapshot -- ern-ops/source-availability.json | tee ern-ops/trend-current.json
          npm --silent run operations:status | tee ern-ops/operations-status.json
      - name: Fetch private analytics evidence
        env:
          ERN_ANALYTICS_REVIEW_TOKEN: ${{ secrets.ERN_SIGNAL_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          npm --silent run analytics:summary -- 30 > ern-ops/analytics-private.json
          npm --silent run analytics:redact -- ern-ops/analytics-private.json | tee ern-ops/analytics-summary.json
          npm --silent run analytics:owner-report -- ern-ops/analytics-private.json ern-ops/analytics-owner-report.md
          npm --silent run analytics:owner-dashboard -- ern-ops/analytics-private.json ern-ops/analytics-owner-dashboard.html
          cat ern-ops/analytics-owner-report.md >> "$GITHUB_STEP_SUMMARY"
          npm --silent run analytics:distribution-observation -- ern-ops/analytics-private.json data/organic-distribution-events.json | tee ern-ops/organic-distribution-observation.json
          npm --silent run analytics:search-gap-triage -- ern-ops/analytics-private.json | tee ern-ops/search-gap-triage.json
          npm --silent run analytics:traffic-growth-brief -- ern-ops/analytics-private.json data/organic-distribution-events.json ern-ops/traffic-growth-brief.md
          cat ern-ops/traffic-growth-brief.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare operations trend
        if: always()
        run: |
          set -euo pipefail
          if [ -f ern-ops/trend-current.json ]; then
            if [ -f ern-history/previous.json ]; then
              npm --silent run operations:trend-compare -- ern-history/previous.json ern-ops/trend-current.json | tee ern-ops/trend-delta.json
            else
              npm --silent run operations:trend-compare -- - ern-ops/trend-current.json | tee ern-ops/trend-delta.json
            fi
            cp ern-ops/trend-current.json ern-history/previous.json
          fi
      - name: Build operator brief
        if: always()
        run: |
          set -euo pipefail
          if [ -f ern-ops/trend-current.json ]; then
            npm --silent run operations:brief -- ern-ops/trend-current.json ern-ops/trend-delta.json ern-ops/source-availability.json ern-ops/inside-recovery.json ern-ops/embed-research.json ern-ops/inside-playback-horizon.json ern-ops/embed-research-preflight.json ern-ops/source-availability-continuity.json ern-ops/commercial-inventory.json ern-ops/commercial-onboarding-plan.json ern-ops/submission-transport-readiness.json ern-ops/commercial-verification-horizon.json ern-ops/playback-evidence-consistency.json ern-ops/provider-family-research.json ern-ops/provider-generated-targets.json ern-ops/provider-discovery-queue.json ern-ops/operator-review-queue.json ern-ops/research-review-queue.json ern-ops/source-revalidation-triage.json ern-ops/commercial-research.json ern-ops/commercial-research-depth.json ern-ops/affiliate-platform-research.json ern-ops/affiliate-application-readiness.json ern-ops/earth-signals-status.json ern-ops/guide-ai-status.json ern-ops/local-directory-status.json ern-ops/participation-infrastructure.json ern-ops/now-moment-media-status.json ern-ops/business-control.json ern-ops/external-gates.json ern-ops/earth-signals-live-health.json ern-ops/phase4-earth-signals-observation.json ern-ops/phase5-readiness.json ern-ops/phase5-operating-status.json ern-ops/phase6-operating-status.json ern-ops/phase7-operating-status.json ern-ops/phase8-operating-status.json ern-ops/phase9-operating-status.json ern-ops/phase10-operating-status.json ern-ops/current-image-pilot-observation.json ern-ops/organic-distribution-observation.json ern-ops/search-gap-triage.json | tee ern-ops/operator-brief.md
            npm --silent run sources:searchable-health-summary -- ern-ops/searchable-source-health.json | tee -a ern-ops/operator-brief.md
          fi
      - name: Validate operations packet
        if: always()
        run: |
          set -euo pipefail
          npm --silent run operations:packet-integrity -- ern-ops | tee ern-ops/packet-integrity.json
      - name: Save latest trend snapshot
        if: always() && hashFiles('ern-history/previous.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ern-history/previous.json
          key: ern-ops-trend-${{ github.run_id }}
      - name: Save latest availability sample
        if: always() && hashFiles('ern-history/availability-previous.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ern-history/availability-previous.json
          key: ern-availability-${{ github.run_id }}
      - name: Save searchable source health state
        if: always() && hashFiles('ern-history/searchable-source-health-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ern-history/searchable-source-health-state.json
          key: ern-searchable-health-${{ github.run_id }}
      - name: Retain operations packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ern-operations-${{ github.run_number }}
          path: ern-ops/
          if-no-files-found: warn
          retention-days: 14
