name: ERN Operations Check

# Manual while the product is being simplified and stabilized.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check live-source essentials
        run: |
          npm run sources:horizon
          npm run watch-earth:now
          npm run operations:status
