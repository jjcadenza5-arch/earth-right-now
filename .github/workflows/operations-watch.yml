name: ERN Operations Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check live-source essentials
        run: |
          npm run sources:horizon
          npm run watch-earth:now
          npm run provider:worklist
          npm run inside:recovery
          npm run operations:status
