name: Deploy ERN to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/app-lite.js"
      - "src/styles-lite.css"
      - "data/sources.json"
      - "assets/**"
      - "about.html"
      - "privacy.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "offline.html"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "scripts/lean-preflight.mjs"
      - "scripts/public-launch-preflight.mjs"
      - "scripts/mobile-layout-preflight.mjs"
      - "scripts/build-release-snapshot.mjs"
      - "scripts/build-destination-pages.mjs"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ern-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lean launch preflight
        run: node scripts/lean-preflight.mjs
      - name: Public launch preflight
        run: node scripts/public-launch-preflight.mjs
      - name: Mobile layout preflight
        run: node scripts/mobile-layout-preflight.mjs
      - name: Build static release
        run: npm run release:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
