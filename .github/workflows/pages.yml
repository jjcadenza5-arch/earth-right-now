name: Deploy ERN to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/app-lite.js"
      - "src/fullscreen-continuity.js"
      - "src/guide-public-copy.js"
      - "src/guide-ai-client.js"
      - "src/guide-ai-routing.js"
      - "src/guide-ai-capabilities.js"
      - "src/guide-ai-activation.js"
      - "src/current-window-label.js"
      - "src/playback-capability.js"
      - "src/playback-proof.js"
      - "src/now-evidence.js"
      - "src/local-directory-status.js"
      - "src/travel-offer-verification.js"
      - "src/affiliate-partners.js"
      - "scripts/local-directory-status.mjs"
      - "src/styles-lite.css"
      - "data/sources.json"
      - "data/source-research-priorities.json"
      - "data/visitor-source-expansion-candidates.json"
      - "data/realtime-context-sources.json"
      - "docs/SEE_BEFORE_YOU_GO_STANDARD.md"
      - "data/local-directory.json"
      - "data/travel-offers.json"
      - "data/affiliate-partners.json"
      - "data/affiliate-platform-research.json"
      - "data/commercial-link-opportunities.json"
      - "data/business-readiness.json"
      - "data/provider-observations.json"
      - "data/embed-research-candidates.json"
      - "tests/**"
      - "package.json"
      - "data/embed-provider-families.json"
      - "src/research-review-queue.js"
      - "src/embed-research-preflight.js"
      - "tests/embed-research-preflight.smoke.js"
      - "src/provider-family-research.js"
      - "src/recency-provider-debt.js"
      - "tests/research-review-queue.smoke.js"
      - "tests/recency-provider-debt.smoke.js"
      - "scripts/operator-review-page-preflight.mjs"
      - "scripts/research-review-queue.mjs"
      - "scripts/provider-family-research-status.mjs"
      - "assets/**"
      - "about.html"
      - "press.html"
      - "data/public-brand-facts.json"
      - "privacy.html"
      - "now-moments.html"
      - "for-places.html"
      - "stories.html"
      - "src/ern-stories.js"
      - "src/stories-page.js"
      - "src/share-links.js"
      - "src/telemetry-policy.js"
      - "src/telemetry.js"
      - "src/commercial-attribution-runtime.js"
      - "src/discovery-eligibility.js"
      - "src/source-recency.js"
      - "src/catalog-metadata-audit.js"
      - "src/manual-context-record.js"
      - "src/solar-moment.js"
      - "src/media-identity.js"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "offline.html"
      - "release-verification.html"
      - "src/release-verification-console.js"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "scripts/lean-preflight.mjs"
      - "scripts/whole-product-preflight.mjs"
      - "scripts/whole-product-status.mjs"
      - "scripts/public-launch-preflight.mjs"
      - "scripts/mobile-layout-preflight.mjs"
      - "scripts/accessibility-preflight.mjs"
      - "scripts/performance-preflight.mjs"
      - "scripts/rollback-preflight.mjs"
      - "scripts/participation-preflight.mjs"
      - "scripts/featured-curation-preflight.mjs"
      - "scripts/guide-see-before-go-preflight.mjs"
      - "scripts/source-research-priority-status.mjs"
      - "scripts/source-recency-summary.mjs"
      - "scripts/catalog-metadata-status.mjs"
      - "scripts/visitor-source-expansion-status.mjs"
      - "scripts/realtime-context-status.mjs"
      - "tests/realtime-context.smoke.js"
      - "tests/manual-context-record.smoke.js"
      - "scripts/commercial-placement-preflight.mjs"
      - "data/rollback-proof.json"
      - "scripts/build-release-snapshot.mjs"
      - "scripts/public-module-integrity.mjs"
      - "scripts/build-destination-pages.mjs"
      - "scripts/build-operator-review.mjs"
      - "src/inside-ern-recovery.js"
      - "src/embed-policy.js"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ern-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax preflight
        run: |
          set -euo pipefail
          find src scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: ERN current release smoke suite
        run: npm --silent run test:release
      - name: Lean launch preflight
        run: node scripts/lean-preflight.mjs
      - name: Whole-product guard
        run: node scripts/whole-product-preflight.mjs
      - name: Whole-product status
        run: node scripts/whole-product-status.mjs
      - name: Public launch preflight
        run: node scripts/public-launch-preflight.mjs
      - name: Mobile layout preflight
        run: node scripts/mobile-layout-preflight.mjs
      - name: Accessibility preflight
        run: node scripts/accessibility-preflight.mjs
      - name: Performance preflight
        run: node scripts/performance-preflight.mjs
      - name: Rollback preflight
        run: node scripts/rollback-preflight.mjs
      - name: Participation safety preflight
        run: node scripts/participation-preflight.mjs
      - name: Featured curation preflight
        run: node scripts/featured-curation-preflight.mjs
      - name: Catalog metadata completeness
        run: node scripts/catalog-metadata-status.mjs
      - name: Local Earth directory integrity
        run: npm --silent run local:directory-status
      - name: Source recency maintenance summary
        run: node scripts/source-recency-summary.mjs
      - name: Source research priority integrity
        run: node scripts/source-research-priority-status.mjs
      - name: Guide See before go preflight
        run: node scripts/guide-see-before-go-preflight.mjs
      - name: Visitor source expansion integrity
        run: node scripts/visitor-source-expansion-status.mjs
      - name: Real-time context integrity
        run: node scripts/realtime-context-status.mjs
      - name: Context truth smoke checks
        run: |
          node tests/realtime-context.smoke.js
          node tests/manual-context-record.smoke.js
      - name: Commercial placement integrity preflight
        run: node scripts/commercial-placement-preflight.mjs
      - name: Build static release
        run: npm run release:build
      - name: Public module integrity
        run: npm --silent run release:public-module-integrity -- dist
      - name: Public discoverability preflight
        run: npm --silent run discoverability:preflight -- dist
      - name: Operator review page preflight
        run: node scripts/operator-review-page-preflight.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
