permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ern-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax preflight
        run: |
          set -euo pipefail
          find src scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: ERN current release smoke suite
        run: npm --silent run test:release
      - name: Lean launch preflight
        run: node scripts/lean-preflight.mjs
      - name: Whole-product guard
        run: node scripts/whole-product-preflight.mjs
      - name: Whole-product status
        run: node scripts/whole-product-status.mjs
      - name: Public launch preflight
        run: node scripts/public-launch-preflight.mjs
      - name: Mobile layout preflight
        run: node scripts/mobile-layout-preflight.mjs
      - name: Accessibility preflight
        run: node scripts/accessibility-preflight.mjs
      - name: Performance preflight
        run: node scripts/performance-preflight.mjs
      - name: Rollback preflight
        run: node scripts/rollback-preflight.mjs
      - name: Participation safety preflight
        run: node scripts/participation-preflight.mjs
      - name: Participation infrastructure readiness
        run: npm --silent run participation:status
      - name: Now Moment media readiness
        run: npm --silent run participation:media-status
      - name: Featured curation preflight
        run: node scripts/featured-curation-preflight.mjs
      - name: Watch Earth first-impression audit
        run: npm --silent run watch-earth:audit
      - name: Catalog metadata completeness
        run: node scripts/catalog-metadata-status.mjs
      - name: Local Earth directory integrity
        run: npm --silent run local:directory-status
      - name: Source recency maintenance summary
        run: node scripts/source-recency-summary.mjs
      - name: Source research priority integrity
        run: node scripts/source-research-priority-status.mjs
      - name: Multilingual place alias integrity
        run: npm --silent run search:place-alias-status
      - name: Search metadata retrieval integrity
        run: npm --silent run search:metadata-audit
      - name: Supplemental Search catalog integrity
        run: npm --silent run search:supplemental-status
      - name: Provider concentration resilience
        run: node scripts/provider-concentration-status.mjs
      - name: Guide See before go preflight
        run: node scripts/guide-see-before-go-preflight.mjs
      - name: Visitor source expansion integrity
        run: node scripts/visitor-source-expansion-status.mjs
      - name: Real-time context integrity
        run: node scripts/realtime-context-status.mjs
      - name: Seoul context mapping integrity
        run: node scripts/seoul-context-mapping-status.mjs
      - name: Context truth smoke checks
        run: |
          node tests/realtime-context.smoke.js
          node tests/manual-context-record.smoke.js
      - name: Commercial placement integrity preflight
        run: node scripts/commercial-placement-preflight.mjs
      - name: Build static release
        run: npm run release:build
      - name: Public module integrity
        run: npm --silent run release:public-module-integrity -- dist
      - name: SEO indexing readiness
        run: npm --silent run seo:indexing-audit -- dist
      - name: AI search discovery readiness
        run: npm --silent run ai-search:readiness -- dist
      - name: Public brand identity integrity
        run: node scripts/public-brand-facts-status.mjs
      - name: Organic distribution readiness
        run: npm --silent run distribution:status
      - name: External gate register integrity
        run: node scripts/external-gate-register.mjs
      - name: Canonical project phase status
        run: npm --silent run project:phase
      - name: Autonomous work status
        run: npm --silent run project:autonomous-status
      - name: Public discoverability preflight
        run: npm --silent run discoverability:preflight -- dist
      - name: Operator review page preflight
        run: node scripts/operator-review-page-preflight.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Wait for Pages artifact registration
        run: sleep 8
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify deployed social preview metadata
        run: node scripts/social-preview-production-check.mjs https://earthrightnow.app/
      - name: Verify deployed visitor reality sync
        run: node scripts/production-reality-check.mjs https://earthrightnow.app/
      - name: IndexNow recent URL notification
        run: node scripts/indexnow-submit.mjs dist
