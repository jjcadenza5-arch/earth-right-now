name: Deploy ERN to GitHub Pages

# BUILD MODE: deploy only when deliberately requested.
# Re-enable a single push-to-main deployment after the consolidation pass is complete.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ern-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify essentials
        run: |
          npm test
          npm run accessibility:preflight
          npm run mobile:preflight
      - name: Build static site
        run: npm run release:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
