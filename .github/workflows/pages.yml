name: Deploy ERN to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/app-lite.js"
      - "src/styles-lite.css"
      - "data/sources.json"
      - "data/local-directory.json"
      - "data/travel-offers.json"
      - "data/provider-observations.json"
      - "data/embed-research-candidates.json"
      - "assets/**"
      - "about.html"
      - "privacy.html"
      - "now-moments.html"
      - "for-places.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "offline.html"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "scripts/lean-preflight.mjs"
      - "scripts/whole-product-preflight.mjs"
      - "scripts/whole-product-status.mjs"
      - "scripts/public-launch-preflight.mjs"
      - "scripts/mobile-layout-preflight.mjs"
      - "scripts/accessibility-preflight.mjs"
      - "scripts/performance-preflight.mjs"
      - "scripts/rollback-preflight.mjs"
      - "scripts/participation-preflight.mjs"
      - "scripts/featured-curation-preflight.mjs"
      - "data/rollback-proof.json"
      - "scripts/build-release-snapshot.mjs"
      - "scripts/build-destination-pages.mjs"
      - "scripts/build-operator-review.mjs"
      - "src/inside-ern-recovery.js"
      - "src/embed-policy.js"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ern-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax preflight
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Lean launch preflight
        run: node scripts/lean-preflight.mjs
      - name: Whole-product guard
        run: node scripts/whole-product-preflight.mjs
      - name: Whole-product status
        run: node scripts/whole-product-status.mjs
      - name: Public launch preflight
        run: node scripts/public-launch-preflight.mjs
      - name: Mobile layout preflight
        run: node scripts/mobile-layout-preflight.mjs
      - name: Accessibility preflight
        run: node scripts/accessibility-preflight.mjs
      - name: Performance preflight
        run: node scripts/performance-preflight.mjs
      - name: Rollback preflight
        run: node scripts/rollback-preflight.mjs
      - name: Participation safety preflight
        run: node scripts/participation-preflight.mjs
      - name: Featured curation preflight
        run: node scripts/featured-curation-preflight.mjs
      - name: Build static release
        run: npm run release:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
