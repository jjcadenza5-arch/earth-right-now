name: Deploy ERN Beta to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run accessibility:preflight
      - run: npm run mobile:preflight
      - run: npm run release:preflight
      - run: npm run catalog:embeds
      - run: npm run catalog:fallbacks
      - run: npm run watch-earth:audit
      - run: npm run release:evidence
      - run: npm run release:status
      - name: Build immutable Pages artifact
        run: npm run release:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-origin:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Diagnose custom-domain DNS and TLS
        id: domain
        continue-on-error: true
        run: npm run domain:health -- earthrightnow.app | tee /tmp/ern-domain-health.json
      - name: Publish custom-domain diagnostics
        if: always()
        shell: bash
        run: |
          echo "## ERN custom-domain verification" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ern-domain-health.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "${{ steps.domain.outcome }}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Pages artifact deployed, but the custom domain is not yet safe to certify. Check apex DNS records and GitHub Pages HTTPS provisioning before treating this as an application regression." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce custom-domain health
        if: steps.domain.outcome != 'success'
        run: |
          echo "::error::earthrightnow.app failed DNS/TLS/HTTPS health checks. The deployed artifact may be healthy; repair custom-domain DNS/HTTPS before origin certification."
          exit 1
      - name: Verify public custom-domain origin and exact commit
        if: steps.domain.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          base="https://earthrightnow.app"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$base/" -o /tmp/ern-index.html; then
              break
            fi
            if [ "$attempt" = "5" ]; then exit 1; fi
            sleep 10
          done
          grep -F 'rel="canonical" href="https://earthrightnow.app/"' /tmp/ern-index.html
          curl --fail --silent --show-error --location --max-time 20 "$base/release-manifest.json" -o /tmp/ern-release-manifest.json
          grep -F "\"commit\": \"${GITHUB_SHA}\"" /tmp/ern-release-manifest.json
          for path in /manifest.webmanifest /robots.txt /about.html /privacy.html; do
            curl --fail --silent --show-error --location --max-time 20 "$base$path" -o /dev/null
          done
          curl --fail --silent --show-error --location --max-time 20 "$base/robots.txt" | grep -F 'Sitemap: https://earthrightnow.app/sitemap.xml'
