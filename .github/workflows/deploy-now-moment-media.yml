name: Deploy ERN Now Moment Media Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify media safety gates
        run: |
          set -euo pipefail
          node tests/now-moment-media-worker.smoke.js
          node tests/now-moment-photo-foundation.smoke.js
          node tests/now-moment-photo-service.smoke.js
          grep -q '"ERN_NOW_MOMENT_PHOTO_ENABLED": "false"' media-worker/wrangler.jsonc
      - name: Require Cloudflare and media runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_MEDIA_RATE_HMAC_KEY: ${{ secrets.ERN_MEDIA_RATE_HMAC_KEY }}
          ERN_MEDIA_REVIEW_TOKEN: ${{ secrets.ERN_MEDIA_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ERN_MEDIA_RATE_HMAC_KEY"
          test -n "$ERN_MEDIA_REVIEW_TOKEN"
      - name: Ensure private R2 bucket exists
        working-directory: media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@latest r2 bucket list | grep -q 'ern-now-moment-media'; then
            npx --yes wrangler@latest r2 bucket create ern-now-moment-media
          fi
      - name: Install media runtime secrets
        working-directory: media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ERN_MEDIA_RATE_HMAC_KEY: ${{ secrets.ERN_MEDIA_RATE_HMAC_KEY }}
          ERN_MEDIA_REVIEW_TOKEN: ${{ secrets.ERN_MEDIA_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ERN_MEDIA_RATE_HMAC_KEY" | npx --yes wrangler@latest secret put ERN_MEDIA_RATE_HMAC_KEY
          printf '%s' "$ERN_MEDIA_REVIEW_TOKEN" | npx --yes wrangler@latest secret put ERN_MEDIA_REVIEW_TOKEN
      - name: Deploy media Worker fail-closed
        working-directory: media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Preserve public-off boundary
        run: |
          set -euo pipefail
          grep -q '"ERN_NOW_MOMENT_PHOTO_ENABLED": "false"' media-worker/wrangler.jsonc
          echo "Media infrastructure may be deployed; visitor photo upload remains off."
