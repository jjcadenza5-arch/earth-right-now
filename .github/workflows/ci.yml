name: ERN CI

# BUILD MODE: manual only while ERN is being consolidated.
# This prevents every small repository change from starting another full test run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run focused ERN smoke suite
        run: npm test
      - name: Verify accessibility and mobile contracts
        run: |
          npm run accessibility:preflight
          npm run mobile:preflight
      - name: Verify public-launch essentials
        run: |
          npm run catalog:embeds
          npm run catalog:fallbacks
          npm run watch-earth:audit
          npm run release:preflight
