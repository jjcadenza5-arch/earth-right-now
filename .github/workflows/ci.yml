name: ERN CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run ERN smoke suite
        id: smoke
        run: |
          set -o pipefail
          npm test 2>&1 | tee smoke-output.txt
      - name: Audit embed registry
        run: npm run catalog:embeds
      - name: Audit provider fallback chains
        run: npm run catalog:fallbacks
      - name: Audit Watch Earth across global dayparts
        run: npm run watch-earth:audit
      - name: Audit release evidence ledger
        if: success()
        run: npm run release:evidence
      - name: Report release posture
        if: success()
        run: npm run release:status
      - name: Report beta readiness
        if: success()
        run: npm run release:readiness
      - name: Report business readiness
        if: success()
        run: npm run business:status
      - name: Report release candidate
        if: success()
        run: npm run release:candidate
      - name: Publish smoke output to summary
        if: always()
        run: |
          echo "## ERN smoke output" >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 smoke-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ern-smoke-diagnostics
          path: smoke-output.txt
          retention-days: 3
      - name: Publish smoke failure summary
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "## ERN smoke suite failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The npm test step above reports each failing *.smoke.js filename and exit code." >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run locally with: npm test" >> "$GITHUB_STEP_SUMMARY"
