    <stop offset=".62" stop-color="#f5a437" stop-opacity=".55"/><stop offset="1" stop-color="#f5a437" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
