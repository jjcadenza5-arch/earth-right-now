<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="t d">
<title id="t">Mount Fuji at sunrise</title>
<desc id="d">Editorial illustration of Mount Fuji above cloud-filled foothills at sunrise, inspired by the approved Earth Right Now homepage mockup.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6d93ba"/><stop offset=".46" stop-color="#8eb0c9"/>
    <stop offset=".73" stop-color="#f1b882"/><stop offset="1" stop-color="#f7d09a"/>
  </linearGradient>
  <linearGradient id="mount" x1=".2" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#d6dde5"/><stop offset=".12" stop-color="#eef2f3"/>
    <stop offset=".22" stop-color="#8d9baa"/><stop offset=".64" stop-color="#425269"/><stop offset="1" stop-color="#253546"/>
  </linearGradient>
  <linearGradient id="foothill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#435970"/><stop offset="1" stop-color="#172b3b"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
